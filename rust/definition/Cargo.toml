[package]
name = "spore-definition"
description = "The spore .cmk definition and schedule: grammar, schema, refusals and when a schedule is due, one implementation for JS and Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
croner = { version = "4.0.0", default-features = false, features = ["jiff"] }
jiff = "0.2.37"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
