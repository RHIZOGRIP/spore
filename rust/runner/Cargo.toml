[package]
name = "spore-runner"
description = "The runner and the cell supervisor: the lock, an admission slot, the model path, the brokers, the confined agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "spore_runner"
path = "src/lib.rs"

[[bin]]
name = "spore-runner"
path = "src/main.rs"

[[bin]]
name = "spore-spawn"
path = "src/spawn.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
libc = "0.2"
# One mohdel release on both sides: this tag is the npm pin in package.json, and
# test/model-client.test.js fails the build when they differ.
mohdel-thin-gate = { git = "https://github.com/clbrge/mohdel", tag = "v4.0.0" }
mohdel-client = { git = "https://github.com/clbrge/mohdel", tag = "v4.0.0" }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
spore-definition = { path = "../definition" }
spore-workspace = { path = "../workspace" }
tokio = { version = "1", features = ["rt", "macros", "process", "signal", "net", "sync", "time"] }
url = "2"
