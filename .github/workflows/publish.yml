name: Publish spore

on:
  push:
    tags:
      - 'v*'

# spore ships its native code prebuilt, inside the package: `native/<arch>/` holds the Rust
# addon, the runner, spore-spawn, the sandbox addon and confine, one directory per architecture,
# each built on a runner of that architecture, so a consumer installs without a C compiler or
# cargo. The binaries need these images' glibc or newer.

permissions:
  contents: read
  id-token: write

jobs:
  native:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Third-party actions are pinned to commits: a moved tag would run whatever it was moved to.
      # dtolnay/rust-toolchain@stable as of 2026-08-05
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - run: npm run build -w @rhizogrip/spore

      - name: Check the build is this architecture's, and whole
        run: |
          set -euo pipefail
          [ "$(node -p process.arch)" = "${{ matrix.arch }}" ] || { echo "::error::this runner is $(node -p process.arch), not ${{ matrix.arch }}"; exit 1; }
          for file in spore.node spore-runner spore-spawn sandbox.node confine; do
            [ -f "packages/spore/native/${{ matrix.arch }}/$file" ] || { echo "::error::native/${{ matrix.arch }}/$file was not built"; exit 1; }
          done

      # An artifact does not keep file modes, so the binaries travel in a tarball, executable.
      - run: tar -czf native-${{ matrix.arch }}.tgz -C packages/spore native/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: native-${{ matrix.arch }}.tgz
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; npm 12.0.0 ships without the sigstore
      # module that `publish --provenance` loads.
      - run: npm install -g npm@11

      - name: Refuse a tag that disagrees with the packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for dir in packages/spore packages/spore-cli; do
            declared=$(node -p "require('./$dir/package.json').version")
            [ "$declared" = "$version" ] || { echo "::error::$dir/package.json says $declared and the tag says $version"; exit 1; }
          done

      # Dependencies' install scripts would run holding this job's publishing identity.
      - run: npm ci --omit=dev --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-builds
          merge-multiple: true
      - run: for built in native-builds/*.tgz; do tar -xzf "$built" -C packages/spore; done

      - name: Pack, and check the native files are in it
        # npm has been seen running the build during `pack` despite --ignore-scripts, with its
        # output on stdout, so the tarball is found by listing rather than by what pack printed.
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack -w @rhizogrip/spore --ignore-scripts --pack-destination dist > /dev/null
          tarball="$PWD/$(ls dist/*.tgz)"
          packed=$(tar -tzf "$tarball")
          for arch in x64 arm64; do
            for file in spore.node spore-runner spore-spawn sandbox.node confine; do
              echo "$packed" | grep -qx "package/native/$arch/$file" || { echo "::error::native/$arch/$file is not in the package"; exit 1; }
            done
          done
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish @rhizogrip/spore
        run: npm publish "$TARBALL" --provenance --access public --ignore-scripts
        # Only until every package has a trusted publisher on npmjs; a package must exist first.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @rhizogrip/spore-cli
        # After the core it depends on, at the same version.
        run: |
          set -euo pipefail
          mkdir -p dist-cli
          npm pack -w @rhizogrip/spore-cli --ignore-scripts --pack-destination dist-cli > /dev/null
          npm publish "$PWD/$(ls dist-cli/*.tgz)" --provenance --access public --ignore-scripts
        # Only until every package has a trusted publisher on npmjs; a package must exist first.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Created here, with this workflow's own token, so cutting a release needs nothing on the machine
  # that pushed the tag; and only once the packages are on npm.
  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" 'index($0, head) == 1 { flag = 1; next } /^## \[/ { flag = 0 } flag' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no ## [$version] section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "spore $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
