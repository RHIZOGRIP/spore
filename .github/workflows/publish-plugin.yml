name: Publish a plugin or a package versioned on its own

on:
  push:
    tags:
      - 'plugin-*-v*'
      - 'package-*-v*'

# One workflow for every package released on its own: plugin-<name>-v<version> publishes
# plugins/<name>, package-<name>-v<version> publishes packages/<name>, and the version has to agree
# with its package.json. Such a package has nothing to build; what it depends on comes from npm
# when it is installed.

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; npm 12.0.0 ships without the sigstore
      # module that `publish --provenance` loads.
      - run: npm install -g npm@11

      - name: Find the package the tag names
        run: |
          set -euo pipefail
          kind="${GITHUB_REF_NAME%%-*}"
          rest="${GITHUB_REF_NAME#*-}"
          name="${rest%-v*}"
          version="${rest##*-v}"
          dir="${kind}s/$name"
          test -f "$dir/package.json" || { echo "::error::tag $GITHUB_REF_NAME names no $dir/package.json"; exit 1; }
          declared=$(node -p "require('./$dir/package.json').version")
          [ "$declared" = "$version" ] || { echo "::error::$dir/package.json says $declared and the tag says $version"; exit 1; }
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        working-directory: ${{ env.PACKAGE_DIR }}
        # Only until every package has a trusted publisher on npmjs; a package must exist first.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
